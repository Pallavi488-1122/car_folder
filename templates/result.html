<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prediction Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0,0,0,0.70),
                    rgba(0,0,0,0.75)
                ),
                url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1920&q=90");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            align-items: center;
        }

        .result-card {
            background: rgba(255,255,255,0.96);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .price {
            color: #dc3545;
            font-size: 48px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card result-card text-center p-5">

                    <h1 class="mb-3">
                        🚗 Prediction Result
                    </h1>

                    <p class="text-muted">
                        Estimated Car Selling Price
                    </p>


                    <div class="price mb-4">

                        ₹ {{ prediction }} Lakh

                    </div>


                    <hr>


                    <div class="row mt-3">

                        <div class="col-md-6 mb-3">
                            <strong>Manufacturing Year:</strong>
                            <br>
                            {{ year }}
                        </div>


                        <div class="col-md-6 mb-3">
                            <strong>Kilometers Driven:</strong>
                            <br>
                            {{ km }} KM
                        </div>


                        <div class="col-md-6 mb-3">
                            <strong>Fuel Type:</strong>
                            <br>
                            {{ fuel }}
                        </div>


                        <div class="col-md-6 mb-3">
                            <strong>Transmission:</strong>
                            <br>
                            {{ transmission }}
                        </div>


                        <div class="col-md-12 mb-3">
                            <strong>Previous Owners:</strong>
                            <br>
                            {{ owners }}
                        </div>

                    </div>


                    <a href="/"
                       class="btn btn-danger mt-3 p-3">

                        ← Predict Another Car

                    </a>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
