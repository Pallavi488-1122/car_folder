<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Price Prediction</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)),
                url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1920&q=90");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.85) !important;
        }

        .hero {
            color: white;
            text-align: center;
            padding: 70px 15px 40px;
        }

        .hero h1 {
            font-size: 45px;
            font-weight: bold;
        }

        .hero p {
            font-size: 18px;
        }

        .prediction-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            border: none;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            margin-bottom: 50px;
        }

        .card-header {
            background: #111;
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 25px;
            border-bottom: 4px solid #dc3545;
        }

        .form-control,
        .form-select {
            height: 50px;
            border-radius: 10px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220,53,69,.2);
        }

        .btn-predict {
            padding: 13px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
        }

        .result-box {
            display: none;
            background: #fff5f5;
            border: 1px solid #f5c2c7;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            margin-top: 25px;
        }

        .price {
            color: #dc3545;
            font-size: 38px;
            font-weight: bold;
        }

        footer {
            background: rgba(0,0,0,0.9);
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 32px;
            }

            body {
                background-attachment: scroll;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-car-front-fill text-danger"></i>
                CarPredict
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#prediction">Prediction</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>🚗 Car Price Prediction</h1>

            <p>
                Enter your car details and get an estimated car price.
            </p>
        </div>
    </section>


    <!-- Prediction Form -->
    <section id="prediction">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="card prediction-card">

                        <div class="card-header text-center">
                            <h3 class="mb-1">
                                <i class="bi bi-car-front-fill"></i>
                                Enter Car Details
                            </h3>

                            <p class="mb-0 text-white-50">
                                Fill all details for car price prediction
                            </p>
                        </div>


                        <div class="card-body p-4 p-md-5">

                            <form id="carForm">

                                <div class="row g-3">

                                    <!-- Year -->
                                    <div class="col-md-6">
                                        <label class="form-label">
                                            Manufacturing Year
                                        </label>

                                        <input type="number"
                                               class="form-control"
                                               id="year"
                                               placeholder="Example: 2020"
                                               required>
                                    </div>


                                    <!-- KM Driven -->
                                    <div class="col-md-6">
                                        <label class="form-label">
                                            Kilometers Driven
                                        </label>

                                        <input type="number"
                                               class="form-control"
                                               id="km"
                                               placeholder="Example: 45000"
                                               required>
                                    </div>


                                    <!-- Present Price -->
                                    <div class="col-md-6">
                                        <label class="form-label">
                                            Present Price (₹ Lakh)
                                        </label>

                                        <input type="number"
                                               step="0.01"
                                               class="form-control"
                                               id="presentPrice"
                                               placeholder="Example: 10.50"
                                               required>
                                    </div>


                                    <!-- Fuel -->
                                    <div class="col-md-6">
                                        <label class="form-label">
                                            Fuel Type
                                        </label>

                                        <select class="form-select"
                                                id="fuel"
                                                required>
                                            <option value="">Select Fuel</option>
                                            <option>Petrol</option>
                                            <option>Diesel</option>
                                            <option>CNG</option>
                                        </select>
                                    </div>


                                    <!-- Transmission -->
                                    <div class="col-md-6">
                                        <label class="form-label">
                                            Transmission
                                        </label>

                                        <select class="form-select"
                                                id="transmission"
                                                required>
                                            <option value="">Select Transmission</option>
                                            <option>Manual</option>
                                            <option>Automatic</option>
                                        </select>
                                    </div>


                                    <!-- Owners -->
                                    <div class="col-md-6">
                                        <label class="form-label">
                                            Previous Owners
                                        </label>

                                        <select class="form-select"
                                                id="owners"
                                                required>
                                            <option value="">Select Owners</option>
                                            <option value="0">0</option>
                                            <option value="1">1</option>
                                            <option value="2">2</option>
                                            <option value="3">3+</option>
                                        </select>
                                    </div>

                                </div>


                                <!-- Buttons -->
                                <div class="row mt-4">

                                    <div class="col-md-6 mb-2">
                                        <button type="submit"
                                                class="btn btn-danger w-100 btn-predict">
                                            🔮 Predict Car Price
                                        </button>
                                    </div>

                                    <div class="col-md-6 mb-2">
                                        <button type="reset"
                                                class="btn btn-dark w-100 btn-predict"
                                                onclick="hideResult()">
                                            Reset
                                        </button>
                                    </div>

                                </div>

                            </form>


                            <!-- Result -->
                            <div class="result-box" id="resultBox">

                                <h4>Prediction Result</h4>

                                <p class="text-muted mb-1">
                                    Estimated Car Price
                                </p>

                                <div class="price" id="predictedPrice">
                                    ₹ 0
                                </div>

                                <span class="badge bg-success mt-2">
                                    Estimated Price
                                </span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>
        </div>
    </section>

    


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Prediction JavaScript -->
    <script>
        document.getElementById("carForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let year = parseInt(document.getElementById("year").value);
            let km = parseInt(document.getElementById("km").value);
            let presentPrice = parseFloat(document.getElementById("presentPrice").value);
            let owners = parseInt(document.getElementById("owners").value);

            let currentYear = new Date().getFullYear();
            let carAge = currentYear - year;

            // Simple Car Price Prediction Formula
            let predictedPrice =
                presentPrice
                - (carAge * 0.35)
                - (km / 100000 * 0.8)
                - (owners * 0.25);

            if (predictedPrice < 0.5) {
                predictedPrice = 0.5;
            }

            document.getElementById("predictedPrice").innerHTML =
                "₹ " + predictedPrice.toFixed(2) + " Lakh";

            document.getElementById("resultBox").style.display = "block";

            document.getElementById("resultBox").scrollIntoView({
                behavior: "smooth"
            });
        });


        function hideResult() {
            document.getElementById("resultBox").style.display = "none";
        }
    </script>

</body>
</html>
